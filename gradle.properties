org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod properties
maven_group=com.logvex
archives_base_name=log-addon
mod_version=12.0.0

# Minecraft / Fabric
minecraft_version=1.21.1
